<body>
<canvas id="game"></canvas>
<div id="safe"></div>
<audio id="music" src="music.mp3" loop preload="auto" playsinline></audio>
<div id="namebox" class="hide"><div class="card">
<h2 id="nametitle">Add a player</h2>
<p>A first name or nickname. Progress is saved on this device.</p>
<input id="nameinput" maxlength="12" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="done">
<div class="row"><button id="namecancel">Cancel</button><button id="nameok">Add</button></div>
</div></div>
<script>
'use strict';
// ================= CORE: constants, physics, level data =================
const VERSION = 45;
const T = 32;          // tile size in world units
const LH = 16;         // level height in tiles
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);

// Movement matched to Super Noah: steady top speed, smooth glide to a stop, one gravity up and down
const PH = { G: 0.71, FALLG: 1.65, AIRRUN: 1.14, MAXF: 16, JV: -14.2, CAPV: -5, ACC: 0.7, AACC: 0.45, FRICG: 0.7, FRICA: 0.94,
  RUN: 4.4, ZRUN: 6, SPRING: -19.3, BOP: -10.2, BOPH: -14.8, BALLOON: -14.8, BALLOONH: -17, LINE: -15.9 };
// Easy mode (also matched to Super Noah): 45% speed, gentler acceleration, softer falls
const MOVE = { easy: false };

const SOLID = new Set(['#', 'W', '?', '!', 'U', 'Z', 'A', 'C', 'M', 'R', 'B', 'Y', '^', 'T', 'S']);
// flip switch blocks: 'p' pink is solid while L.flip is 0, 'q' blue while L.flip is 1; bonk 'S' to swap
const FLIP = { p: 0, q: 1 };
const SLOPE = { Q: -1, K: 1 };   // Q rises to the right, K falls to the right (value = downhill direction)
const HIDDEN = new Set(['H', 'J']);   // invisible until bonked from below
const MIX = { m: 5, n: 3, v: 6 };           // purple = red+blue, orange = red+yellow, green = blue+yellow
const CBIT = { R: 1, Y: 2, B: 4 };
const MIXNAME = ['No paint', 'Red', 'Yellow', 'Orange', 'Blue', 'Purple', 'Green', 'Mud'];

function tileAt(L, tx, ty) {
  if (tx < 0 || tx >= L.w) return '#';
  if (ty >= L.h) return '.';
  if (ty < 0) { const c = L.g[0][tx]; return (c === '#' || c === 'W') ? c : '.'; }
  return L.g[ty][tx];
}
function isSolid(L, tx, ty) {
  const c = tileAt(L, tx, ty);
  if (SOLID.has(c)) return true;
  const fv = FLIP[c]; if (fv !== undefined) return (L.flip || 0) === fv;
  const m = MIX[c];
  return m !== undefined && L.colors === m;
}
function toggleFlip(p, L) {
  L.flip = 1 - (L.flip || 0);
  for (let i = 0; i < 4 && overlapsSolid(L, p); i++) p.y -= T;   // never trap the cat inside new blocks
}
// the solid fill under a slope tile is never a floor or wall of its own: the slope surface is
function underSlope(L, tx, ty) { return SLOPE[tileAt(L, tx, ty - 1)] !== undefined; }
function canBonk(L, tx, ty) { return isSolid(L, tx, ty) || HIDDEN.has(tileAt(L, tx, ty)); }
function overlapsSolid(L, r, skipUnder) {
  const x0 = Math.floor(r.x / T), x1 = Math.floor((r.x + r.w - 0.01) / T);
  const y0 = Math.floor(r.y / T), y1 = Math.floor((r.y + r.h - 0.01) / T);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (isSolid(L, tx, ty) && !(skipUnder && underSlope(L, tx, ty))) return true;
  return false;
}
function overlapsTile(L, r, ch, inset) {
  const x0 = Math.floor((r.x + inset) / T), x1 = Math.floor((r.x + r.w - inset) / T);
  const y0 = Math.floor((r.y + inset) / T), y1 = Math.floor((r.y + r.h - inset) / T);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (tileAt(L, tx, ty) === ch) return true;
  return false;
}
function rectHit(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

// ---------------- player ----------------
function newPlayer() {
  return { x: 0, y: 0, w: 22, h: 26, vx: 0, vy: 0, onGround: false, coyote: 0, jbuf: 0, jumping: false, jumpT: 0, face: 1,
    vine: -1, vr: 0, vineCD: 0, riding: false, fuel: 150, hovering: false, power: null, big: false, zoom: 0, gliding: false,
    runT: 0, skid: false, holdJump: false, zip: -1, zt: 0, zs: 0, zipCD: 0, sliding: false, slope: 0, fan: false };
}
function baseSize(p) { return p.big ? { w: 24, h: 31 } : { w: 22, h: 26 }; }
// resize the hitbox keeping the feet and center in place
function applySize(p, L) {
  const b = baseSize(p), w = p.riding ? 28 : b.w, h = p.riding ? b.h + 18 : b.h;
  const cx = p.x + p.w / 2, feet = p.y + p.h;
  p.w = w; p.h = h; p.x = cx - w / 2; p.y = feet - h;
  if (L) for (let i = 0; i < 8 && overlapsSolid(L, p); i++) p.y += 1;
}
function placePlayer(p, L, tx, s) {
  p.x = tx * T + (T - p.w) / 2; p.y = (L.h - s) * T - p.h; p.vx = 0; p.vy = 0; p.vine = -1; p.onGround = false;
}
function dismount(p) { p.riding = false; p.hovering = false; applySize(p); }
function toggleColor(p, L, c) {
  L.colors ^= CBIT[c];
  for (let i = 0; i < 4 && overlapsSolid(L, p); i++) p.y -= T;   // never trap the cat inside new paint
}

function moveX(p, L) {
  p.x += p.vx;
  const dir = p.vx > 0 ? 1 : p.vx < 0 ? -1 : 0; if (!dir) return;
  const top = Math.floor(p.y / T), bot = Math.floor((p.y + p.h - 0.01) / T);
  const tx = dir > 0 ? Math.floor((p.x + p.w - 0.01) / T) : Math.floor(p.x / T);
  for (let ty = top; ty <= bot; ty++) if (isSolid(L, tx, ty) && !underSlope(L, tx, ty)) {
    const feet = p.y + p.h, rise = feet - ty * T;
    // step-up where a slope meets a flat roof, and a ledge assist for jumps that barely miss
    const canStep = ty === bot && !overlapsSolid(L, { x: p.x, y: ty * T - p.h, w: p.w, h: p.h }) &&
      (((p.onGround || p.slope) && rise <= 12 + Math.abs(p.vx)) || (!p.onGround && p.vy >= 0 && rise <= 9));
    if (canStep) { p.y = ty * T - p.h; if (!p.onGround) { p.vy = 0; } return; }
    p.x = dir > 0 ? tx * T - p.w : (tx + 1) * T; p.vx = 0; p.sliding = false; return;
  }
}
function slopeY(L, fx, ty) {
  const c = tileAt(L, Math.floor(fx / T), ty);
  if (SLOPE[c] === undefined) return null;
  const lx = fx - Math.floor(fx / T) * T;
  return c === 'Q' ? ty * T + (T - lx) : ty * T + lx;
}
function slopeSnap(p, L, ev, wasGround) {
  p.slope = 0;
  if (p.vy < 0) return;
  const fx = p.x + p.w / 2, feet = p.y + p.h, ty = Math.floor((feet - 1) / T);
  for (const r of [ty - 1, ty, ty + 1]) {
    const sy = slopeY(L, fx, r); if (sy === null) continue;
    if (feet >= sy - 0.01 || (wasGround && sy - feet < 14)) {
      const ny = sy - p.h;
      if (ny > p.y && overlapsSolid(L, { x: p.x, y: ny, w: p.w, h: p.h }, true)) return;
      p.y = ny; if (!p.onGround && !wasGround) ev.push({ t: 'land' });
      p.onGround = true; p.vy = 0; p.slope = SLOPE[tileAt(L, Math.floor(fx / T), r)];
      return;
    }
  }
}
function moveY(p, L, ev) {
  const oldB = p.y + p.h;
  p.y += p.vy;
  const l = Math.floor(p.x / T), r = Math.floor((p.x + p.w - 0.01) / T);
  const was = p.onGround; p.onGround = false;
  if (p.vy >= 0) {
    const ty = Math.floor((p.y + p.h) / T);
    let land = false, spring = -1, line = -1;
    for (let tx = l; tx <= r; tx++) {
      const c = tileAt(L, tx, ty);
      if (isSolid(L, tx, ty) && !underSlope(L, tx, ty)) { if (oldB <= ty * T + 13) { land = true; if (c === '^' || c === 'T') spring = tx; } }
      else if ((c === '=' || c === '~') && oldB <= ty * T + 0.5) { land = true; if (c === '~') line = tx; }
    }
    if (land) {
      p.y = ty * T - p.h;
      if (spring >= 0) { p.vy = PH.SPRING; p.jumping = false; p.sliding = false; ev.push({ t: 'spring', tx: spring, ty, c: tileAt(L, spring, ty) }); }
      else if (line >= 0) { p.vy = PH.LINE; p.jumping = false; p.sliding = false; ev.push({ t: 'line', tx: line, ty }); }
      else { p.vy = 0; p.onGround = true; if (!was) ev.push({ t: 'land' }); }
    }
  } else {
    const ty = Math.floor(p.y / T);
    const cT = Math.floor((p.x + p.w / 2) / T);
    if (canBonk(L, cT, ty)) { p.y = (ty + 1) * T; p.vy = 2.5; p.jumping = false; ev.push({ t: 'bonk', tx: cT, ty }); return; }
    for (let tx = l; tx <= r; tx++) {
      if (!canBonk(L, tx, ty)) continue;
      // corner nudge so clipping an edge doesn't stop a jump
      if (tx < cT) {
        const ov = (tx + 1) * T - p.x;
        if (ov <= 10 && !overlapsSolid(L, { x: (tx + 1) * T + 0.01, y: p.y, w: p.w, h: p.h })) { p.x = (tx + 1) * T + 0.01; return; }
      } else {
        const ov = p.x + p.w - tx * T;
        if (ov <= 10 && !overlapsSolid(L, { x: tx * T - p.w - 0.01, y: p.y, w: p.w, h: p.h })) { p.x = tx * T - p.w - 0.01; return; }
      }
      p.y = (ty + 1) * T; p.vy = 2.5; p.jumping = false; ev.push({ t: 'bonk', tx, ty }); return;
    }
  }
}

function updateVines(L, t, p) {
  for (let i = 0; i < L.vines.length; i++) {
    const v = L.vines[i];
    if (p && p.vine === i) continue;
    const idle = v.amp * Math.sin(t * v.spd + v.ph);
    v.ang += (idle - v.ang) * 0.06;
  }
}
function tryGrab(p, L, ev) {
  const cx = p.x + p.w / 2, cy = p.y + p.h / 2;
  for (let i = 0; i < L.vines.length; i++) {
    const v = L.vines[i];
    const dx = Math.sin(v.ang) * v.len, dy = Math.cos(v.ang) * v.len;
    let t = ((cx - v.ax) * dx + (cy - v.ay) * dy) / (v.len * v.len);
    if (t < 0.45 || t > 1.08) continue;
    t = Math.min(t, 1);
    const qx = v.ax + dx * t, qy = v.ay + dy * t;
    if (Math.hypot(cx - qx, cy - qy) < 18) {
      p.vine = i; p.vr = Math.max(t * v.len, v.len * 0.75);   // hang low on the rope: predictable swings
      v.ang = Math.atan2(cx - v.ax, cy - v.ay);
      const tx = Math.cos(v.ang), ty = -Math.sin(v.ang);
      v.av = clamp((p.vx * tx + p.vy * ty) / p.vr, -0.08, 0.08);
      p.vx = 0; p.vy = 0; p.jumping = false; p.onGround = false;
      ev.push({ t: 'grab' });
      return;
    }
  }
}
function vineStep(p, inp, L, ev) {
  const v = L.vines[p.vine];
  const dir = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
  v.av += -(PH.G / p.vr) * Math.sin(v.ang) * 0.9;
  if (dir) { v.av += dir * 0.0017; p.face = dir; }
  v.av *= 0.996; v.av = clamp(v.av, -0.09, 0.09);
  v.ang += v.av;
  if (v.ang > 1.25) { v.ang = 1.25; v.av = Math.min(v.av, 0); }
  if (v.ang < -1.25) { v.ang = -1.25; v.av = Math.max(v.av, 0); }
  const ox = p.x, oy = p.y;
  p.x = v.ax + Math.sin(v.ang) * p.vr - p.w / 2;
  p.y = v.ay + Math.cos(v.ang) * p.vr - p.h / 2;
  if (overlapsSolid(L, p)) { p.x = ox; p.y = oy; p.vine = -1; p.vineCD = 20; v.av = 0; return; }
  if (inp.jumpPressed) {
    const s = v.av * p.vr;
    p.vx = clamp(Math.cos(v.ang) * s * 1.15 + dir * 1.2, -6.5, 6.5);
    p.vy = Math.min(-Math.sin(v.ang) * s, 0) - 8;
    p.vine = -1; p.vineCD = 18; p.jumping = true; p.jumpT = 3;
    ev.push({ t: 'release' });
  }
}

function tryZip(p, L, ev) {
  const cx = p.x + p.w / 2, cy = p.y + p.h / 2 - 8;
  for (let i = 0; i < L.zips.length; i++) {
    const z = L.zips[i], dx = z.x2 - z.x1, dy = z.y2 - z.y1, len2 = dx * dx + dy * dy;
    let t = ((cx - z.x1) * dx + (cy - z.y1) * dy) / len2;
    if (t < 0 || t > 0.9) continue;
    const qx = z.x1 + dx * t, qy = z.y1 + dy * t;
    if (Math.hypot(cx - qx, cy - qy) < 20) {
      p.zip = i; p.zt = t; p.zs = Math.max(2.5, Math.abs(p.vx)); p.vx = 0; p.vy = 0; p.jumping = false; p.sliding = false;
      ev.push({ t: 'zip' }); return;
    }
  }
}
function zipStep(p, inp, L, ev) {
  const z = L.zips[p.zip], len = Math.hypot(z.x2 - z.x1, z.y2 - z.y1);
  p.zs = Math.min(p.zs + 0.2, 8.5); p.zt += p.zs / len;
  const t = Math.min(1, p.zt), ox = p.x, oy = p.y;
  p.x = lerp(z.x1, z.x2, t) - p.w / 2; p.y = lerp(z.y1, z.y2, t) + 4;
  p.face = z.x2 > z.x1 ? 1 : -1;
  const blocked = overlapsSolid(L, p);
  if (blocked) { p.x = ox; p.y = oy; }
  if (inp.jumpPressed || t >= 1 || blocked) {
    const ux = (z.x2 - z.x1) / len, uy = (z.y2 - z.y1) / len;
    p.vx = clamp(ux * p.zs, -7, 7); p.vy = inp.jumpPressed ? -10.8 : uy * p.zs * 0.4;
    p.zip = -1; p.zipCD = 20; p.jumping = !!inp.jumpPressed; p.jumpT = 3;
    ev.push({ t: 'unzip' });
  }
}
// One fixed 60fps step of the hero. inp = {left,right,jump,jumpPressed}
function stepPlayer(p, inp, L, ev) {
  if (p.vineCD > 0) p.vineCD--;
  if (p.zipCD > 0) p.zipCD--;
  if (p.zip >= 0) zipStep(p, inp, L, ev);
  else if (p.vine >= 0) vineStep(p, inp, L, ev);
  else {
    const dir = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
    const wasGround = p.onGround;
    p.holdJump = inp.jump;
    let acc = p.onGround ? PH.ACC : PH.AACC, max = p.zoom > 0 ? PH.ZRUN : PH.RUN;
    if (p.soak > 0) max *= 0.7;   // soaked by a Songkran splasher: a bit slower
    if (!p.onGround && !p.riding && p.zoom <= 0) max *= PH.AIRRUN;
    if (p.riding && L.drone && L.drone.kind === 'tuk') max = 6.5;
    if (p.riding && L.drone && L.drone.kind === 'ele') max = 5.4;
    if (p.riding && L.drone && L.drone.kind === 'cart') max = 6.2;
    if (p.riding && L.drone && L.drone.kind === 'jaunt') max = 5.8;
    if (p.riding && L.drone && L.drone.kind === 'twocv') max = 6.2;
    if (MOVE.easy) { max *= 0.45; acc *= 0.35; }
    // slopes: running downhill turns into a belly-slide
    if (p.onGround && p.slope && !p.riding) {
      const d = p.slope;
      if (dir !== -d) p.vx += d * 0.2;
      if (p.vx * d > 3.6 && dir === d) p.sliding = true;
    }
    p.airT = p.onGround ? 0 : (p.airT || 0) + 1;
    if (p.airT > 5) p.sliding = false;
    p.skid = p.onGround && dir !== 0 && p.vx * dir < -2;
    if (p.sliding) {
      const sg = Math.sign(p.vx);
      if (dir && dir === -sg) p.vx -= sg * 0.45;
      if (!p.slope) p.vx -= sg * 0.12;
      p.vx = clamp(p.vx, -7.5, 7.5);
      if (Math.abs(p.vx) < 1.5 && !p.slope) p.sliding = false;
      if (sg) p.face = sg;
    } else if (dir < 0) { p.face = -1; p.vx = p.vx < -max ? Math.min(-max, p.vx * 0.93) : Math.max(p.vx - acc, -max); }
    else if (dir > 0) { p.face = 1; p.vx = p.vx > max ? Math.max(max, p.vx * 0.93) : Math.min(p.vx + acc, max); }
    else { p.vx *= p.onGround ? PH.FRICG : PH.FRICA; if (Math.abs(p.vx) < 0.08) p.vx = 0; }
    if (inp.jumpPressed) p.jbuf = 10; else if (p.jbuf > 0) p.jbuf--;
    if (!inp.jump) p.hopHeld = false;
    if (inp.jump && p.hopHeld && p.onGround && !p.riding) p.jbuf = Math.max(p.jbuf, 1);   // keep holding jump: bouncy repeat hops
    if (p.onGround) p.coyote = 7; else if (p.coyote > 0) p.coyote--;
    if (p.jbuf > 0 && p.coyote > 0) {
      p.vy = p.riding ? (L.drone && (L.drone.kind === 'tuk' || L.drone.kind === 'ele' || L.drone.kind === 'cart' || L.drone.kind === 'jaunt' || L.drone.kind === 'twocv') ? PH.JV : -12.5) : (MOVE.easy ? -13.4 : PH.JV);
      p.onGround = false; p.coyote = 0; p.jbuf = 0; p.jumping = true; p.jumpT = 0; p.sliding = false; p.hopHeld = true;
      ev.push({ t: 'jump' });
    }
    if (p.jumping && !inp.jump && p.vy < PH.CAPV) p.vy = PH.CAPV;     // short hop: cap the upward speed
    if (p.vy >= 0) p.jumping = false;
    if (p.riding && L.drone && (L.drone.kind === 'tuk' || L.drone.kind === 'ele' || L.drone.kind === 'cart' || L.drone.kind === 'jaunt' || L.drone.kind === 'twocv')) { p.hovering = false; p.vy += p.vy < 0 ? PH.G : PH.G; }
    else if (p.riding && L.drone) {
      const cruise = L.drone.hy + 16 - p.h;              // rider's top at Buzz's cruising height
      p.hovering = true; p.jumping = false;
      if (inp.jump) p.vy = Math.max(p.vy - 0.6, -4.2);
      else { const tv = clamp((cruise - p.y) * 0.08, -3, 3); p.vy += (tv - p.vy) * 0.18; }
      if (p.y < 8) { p.y = 8; if (p.vy < 0) p.vy = 0; }
    } else { p.hovering = false; p.vy += (MOVE.easy && p.vy > 0) ? 0.38 : (p.vy > 0 && !p.fan ? PH.G * PH.FALLG : PH.G); }
    if (p.power === 'umbrella' && !p.riding && inp.jump && p.vy > 1.6) { p.vy = 1.6; p.gliding = true; } else p.gliding = false;
    // rooftop fans blow you upward
    p.fan = false;
    p.inPool = false;
    for (const f of L.fans) {
      const cx2 = p.x + p.w / 2, cy2 = p.y + p.h / 2;
      if (cx2 > f.x && cx2 < f.x + f.w && cy2 > f.top && cy2 < f.base) {
        if (f.down) { p.vy = Math.min(p.vy + 0.85, 9); p.splash = true; continue; }
        if (f.pool) { if (p.vy > -4) p.vy = Math.max(Math.min(p.vy, 3) * 0.9 - 0.75, -3.5); p.coyote = Math.max(p.coyote, 6); p.inPool = true; continue; }   // never damp a jump out of the water
        const k = clamp((cy2 - f.top) / (T * 1.5), 0, 1);
        p.vy = Math.max(p.vy - 1.35 * k, -7); p.jumping = false; p.onGround = false; p.fan = true;
        if (f.push) { p.vx = clamp(p.vx + f.push * 0.3, -6.5, 6.5); p.splash = true; }
      }
    }
    const maxF = MOVE.easy ? 8 : PH.MAXF; if (p.vy > maxF) p.vy = maxF;
    const oldB = p.y + p.h;
    moveX(p, L); moveY(p, L, ev); slopeSnap(p, L, ev, wasGround);
    if (p.onGround && L.belts) for (const b of L.belts) {
      const cx3 = p.x + p.w / 2;
      if (Math.abs(p.y + p.h - b.y) < 3 && cx3 > b.x0 && cx3 < b.x1) { const ox = p.x; p.x += b.v; if (overlapsSolid(L, p)) p.x = ox; }
    }
    // bouncy balloons
    if (p.vy > 0) for (let i = 0; i < L.balloons.length; i++) {
      const b = L.balloons[i], top = b.y - b.r, cx2 = p.x + p.w / 2;
      if (Math.abs(cx2 - b.x) < b.r + p.w / 2 - 4 && oldB <= top + 6 && p.y + p.h >= top) {
        p.y = top - p.h; p.vy = p.holdJump ? PH.BALLOONH : PH.BALLOON; p.jumping = p.holdJump; p.jumpT = 3; p.onGround = false;
        ev.push({ t: 'balloon', i }); break;
      }
    }
    if (p.riding && p.onGround) p.fuel = 150;
    if (!p.onGround && !p.riding && p.vineCD === 0 && L.vines.length) tryGrab(p, L, ev);
    if (!p.onGround && !p.riding && p.vine < 0 && p.zipCD === 0 && L.zips.length) tryZip(p, L, ev);
  }
  // secret passages
  const cx = p.x + p.w / 2, cy = p.y + p.h / 2;
  for (const w of L.warps) {
    if (cx > w.x && cx < w.x + w.w && cy > w.y && cy < w.y + w.h) {
      p.vine = -1; p.x = w.dx - p.w / 2; p.y = w.dy - p.h; p.vx = 0; p.vy = 0;
      ev.push({ t: 'warp', w }); break;
    }
  }
  // ride-on buddy
  const d = L.drone;
  if (d && d.ready && !p.riding && p.vine < 0 && p.zip < 0 && p.vy >= 0) {
    if (p.x + p.w > d.x + 2 && p.x < d.x + d.w - 2 && p.y + p.h >= d.y - 4 && p.y + p.h <= d.y + 12) {
      const bh = baseSize(p).h; p.riding = true; applySize(p); p.y = d.y - bh;
      p.vy = 0; p.onGround = false; p.fuel = 150; d.ready = false;
      ev.push({ t: 'mount' });
    }
  }
  if (p.riding && L.dropoff && !L.dropoff.used && rectHit(p, L.dropoff)) {
    dismount(p); L.dropoff.used = true; if (d) d.gone = true; ev.push({ t: 'dropoff' });
  }
  if (overlapsTile(L, p, 'x', 6)) ev.push({ t: 'spike' });
  if (p.y > L.h * T + 40) ev.push({ t: 'pit' });
}

// ---------------- level builder ----------------
function mk(w, name, theme, par) {
  const L = { w, h: LH, g: [], items: [], enemies: [], vines: [], warps: [], flags: [], deco: [], rooms: [],
    name, theme, par, start: { tx: 2, s: 3 }, goal: null, drone: null, dropoff: null, arena: null, colors: 0, hasPaint: false,
    zips: [], fans: [], balloons: [], groups: 0 };
  for (let y = 0; y < LH; y++) L.g.push(new Array(w).fill('.'));
  return L;
}
function fill(L, x0, x1, h0, h1, c) {
  c = c || '#';
  for (let x = x0; x <= x1; x++) for (let h = h0; h <= h1; h++) {
    if (x < 0 || x >= L.w || h < 1 || h > L.h) continue;
    L.g[L.h - h][x] = c;
  }
  if ('RBYmnv'.includes(c)) L.hasPaint = true;
  if ('pqS'.includes(c)) L.hasFlip = true;
}
const ground = (L, x0, x1, top, c) => fill(L, x0, x1, 1, top, c);
const tile = (L, x, h, c) => fill(L, x, x, h, h, c);
const plat = (L, x0, x1, h, c) => fill(L, x0, x1, h, h, c || '=');
const PX = tx => tx * T + 16;
const PY = (L, h) => (L.h - h) * T + 16;
const coin = (L, x, h) => L.items.push({ k: 'coin', x: PX(x), y: PY(L, h) });
const coins = (L, x0, x1, h) => { const gid = x1 - x0 >= 2 ? ++L.groups : 0; for (let x = x0; x <= x1; x++) L.items.push({ k: 'coin', x: PX(x), y: PY(L, h), gid }); };
// a fish trail through a list of [x, h] points (counts as one trail for the "Trail clear!" bonus)
const trail = (L, pts) => { const gid = ++L.groups; for (const [x, h] of pts) L.items.push({ k: 'coin', x: PX(x), y: PY(L, h), gid }); };
// slopes: up from surface hBase over n tiles (rising to the right), or down to hBase
function slopeUp(L, x0, hBase, n) { for (let i = 0; i < n; i++) { fill(L, x0 + i, x0 + i, 1, hBase + i); tile(L, x0 + i, hBase + i + 1, 'Q'); } }
function slopeDown(L, x0, hTop, n) { for (let i = 0; i < n; i++) { fill(L, x0 + i, x0 + i, 1, hTop - i - 1); tile(L, x0 + i, hTop - i, 'K'); } }
// zipline from a high point to a low point (tile coords, h = height of the line at that tile's top)
const zip = (L, x1, h1, x2, h2) => L.zips.push({ x1: x1 * T + 16, y1: (L.h - h1) * T, x2: x2 * T + 16, y2: (L.h - h2) * T });
// fan on surface s at tile x, blowing upward hh tiles
const fan = (L, x, s, hh) => L.fans.push({ x: x * T - 6, w: T + 12, base: (L.h - s) * T, top: (L.h - s - hh) * T, tx: x, s });
// balloon: centre at tile x, height h
const balloon = (L, x, h, c) => L.balloons.push({ x: x * T + 16, y: (L.h - h) * T + 16, r: 16, c: c || 0 });
const star = (L, x, h) => L.items.push({ k: 'coin', x: PX(x), y: PY(L, h) });       // secret rooms are packed with fish
const chest = (L, x, h) => L.items.push({ k: 'chest', x: PX(x), y: PY(L, h) });   // bursts into a pile of fish
const heartItem = (L, x, h) => L.items.push({ k: 'heart', x: PX(x), y: PY(L, h) });
const gold = (L, x, h) => L.items.push({ k: 'gold', x: PX(x), y: PY(L, h) });       // golden fish = 5 fish
const stars = (L, x0, x1, h) => { for (let x = x0; x <= x1; x++) star(L, x, h); };
const token = (L, x, h, i) => L.items.push({ k: 'token', i, x: PX(x), y: PY(L, h) });
const album = (L, x, h) => L.items.push({ k: 'gold', x: PX(x), y: PY(L, h) });
const pigeon = (L, x, s) => L.enemies.push({ k: 'pigeon', x: x * T + 3, y: (L.h - s) * T - 22, w: 26, h: 22 });
const flyer = (L, x, h, amp) => L.enemies.push({ k: 'flyer', x: x * T + 3, y: (L.h - h) * T + 5, w: 26, h: 22, amp: amp || 36 });
const flag = (L, x, s, mode) => L.flags.push({ tx: x, s, mode: mode || 'all', x: x * T + 4, y: (L.h - s) * T - 64, w: 24, h: 64 });
// flagpole at tile x (9 tiles tall); the sunbeam nap cushion sits 3 tiles to the right
const goal = (L, x, s) => { L.goal = { tx: x, s, x: x * T + 10, y: (L.h - s) * T - 9 * T, w: 12, h: 9 * T, base: (L.h - s) * T, cx: (x + 3) * T + 16 }; };
const vine = (L, x, h, len) => L.vines.push({ ax: x * T + 16, ay: (L.h - h + 1) * T, len: len * T, ang: 0, av: 0,
  amp: 0.38, spd: 0.035, ph: L.vines.length * 1.7 });
// a little sign showing a paint recipe: a + b = mix
const sign = (L, x, s, a, b, mix) => L.deco.push({ k: 'sign', x: x * T + 16, y: (L.h - s) * T, a, b, mix });
// a warm patch of sunlight on a rooftop (stand still in it and Noodles naps)
const sunspot = (L, x, s, w) => L.deco.push({ k: 'sun', x: x * T, y: (L.h - s) * T, w: (w || 3) * T });
// empty sunshine jars left along the thief's trail, roughly every 22 tiles on open rooftops
function addJars(L) {
  for (const v of L.vines) {
    const tx = Math.floor(v.ax / T); let ty = Math.floor(v.ay / T) - 1;
    while (ty > 0 && !isSolid(L, tx, ty)) ty--;
    v.pole = Math.max(46, v.ay - (ty + 1) * T + 2);
  }
  const main = L.rooms[0] || { x0: 0, x1: L.w * T };
  for (let tx = 14; tx < main.x1 / T - 12; tx += 22) {
    for (let ty = 2; ty < L.h - 1; ty++) {
      const c = L.g[ty][tx];
      if (c === '#' && L.g[ty - 1][tx] === '.' && L.g[ty - 2][tx] === '.') { L.deco.push({ k: 'jar', x: tx * T + 16, y: ty * T, tilt: (tx % 3) - 1 }); break; }
      if (c !== '.') break;
    }
  }
  return L;
}
const greet = (L, x, text) => L.deco.push({ k: 'greet', x: x * T, text });
const room = (L, x0, x1) => L.rooms.push({ x0: x0 * T, x1: (x1 + 1) * T });
// zone covers tiles x..x+w-1 and heights h..h+hh-1; lands the cat standing at (dx, surface ds)
function warp(L, x, h, w, hh, dx, ds, kind) {
  L.warps.push({ x: x * T, y: (L.h - h - hh + 1) * T, w: w * T, h: hh * T, dx: dx * T + 16, dy: (L.h - ds) * T, kind });
  if (kind === 'chimney') L.deco.push({ k: 'sparkle', x: x * T + w * T / 2, y: (L.h - h - hh + 1) * T });
  else L.deco.push({ k: kind === 'exit' ? 'exit' : 'window', x: x * T, y: (L.h - h - hh + 1) * T, w: w * T, h: hh * T });
}
// secret room: walls at x0, x0+1 and x1; floor height `floor`; ceiling from height `ceil`
function secretRoom(L, x0, x1, floor, ceil) {
  ceil = Math.min(ceil + 2, LH - 2);   // roomier: two more tiles of headroom
  fill(L, x0, x0 + 1, 1, LH); fill(L, x1, x1, 1, LH);
  ground(L, x0 + 2, x1 - 1, floor); fill(L, x0 + 2, x1 - 1, ceil, LH);
  L.rooms.push({ x0: x0 * T, x1: (x1 + 1) * T, secret: true });
}
const drone = (L, x, h) => { L.drone = { x: x * T - 4, y: (L.h - h) * T + 8, w: 40, h: 18, hx: x * T - 4, hy: (L.h - h) * T + 8, ready: true, gone: false }; };
const lizard = (L, x, s) => L.enemies.push({ k: 'lizard', x: x * T, y: (L.h - s) * T - 24, w: 60, h: 24 });
const spray = (L, x, s, hh, push) => L.fans.push({ x: x * T - 6, w: T + 12, base: (L.h - s) * T, top: (L.h - s - hh) * T, tx: x, s, water: true, push: push || 0 });
const squirt = (L, x, s, face) => (L.squirts || (L.squirts = [])).push({ x: x * T + 16, y: (L.h - s) * T, face: face || -1 });
const monkey = (L, x, s) => L.enemies.push({ k: 'monkey', x: x * T, y: (L.h - s) * T - 26, w: 26, h: 26 });
const waterfall = (L, x, s, hh) => L.fans.push({ x: x * T - 4, w: T + 8, base: (L.h - s) * T, top: (L.h - s - hh) * T, tx: x, s, water: true, down: true, push: 0 });
const ele = (L, x, s) => { L.drone = { kind: 'ele', x: x * T - 4, y: (L.h - s) * T - 18, w: 44, h: 18, hx: x * T - 4, hy: (L.h - s) * T - 18, ready: true, gone: false }; };

      g.strokeStyle = th.mid; g.lineWidth = 3; g.beginPath(); g.moveTo(x + bw / 2 - 12, top - 58); g.lineTo(x + bw / 2 + 4, top - 40); g.moveTo(x + bw / 2 + 12, top - 58); g.lineTo(x + bw / 2 - 4, top - 40); g.stroke();

        g.quadraticCurveTo(x0 + dir * w * 0.3, h * 0.5, x0 + dir * w * 0.34, sea); g.lineTo(x0 + dir * w * 0.36, h); g.fill();

      }

let showTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints || 0) > 0;

let ZF = 1;   // browser page-zoom correction (Brave/desktop-mode zoom-out on tablets)
function resize() {

  // real screen instead, so it looks the same in Safari, Chrome, Brave and from the Home Screen.

  const phone = VH < 520;

  SCALE = phone ? VH / (11 * T) : Math.min(VW / (22.5 * T), VH / (11 * T));
